name: Compilar Vault APK

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.0.0'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Empaquetar con Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "índice.html" ]; then
            cp "índice.html" www/index.html
          else
            cp *.html www/index.html
          fi
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.smartcenter.vault",
            "appName": "Vault",
            "webDir": "www"
          }
          EOF

          npx cap add android

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Vault.apk

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Vault-Instalador
          path: Vault.apk
