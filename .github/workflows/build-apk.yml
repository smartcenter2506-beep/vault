name: Compilar Vault APK

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Empaquetar con Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          elif [ -f "índice.html" ]; then
            cp "índice.html" www/index.html
          fi

          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init Vault com.smartcenter.vault --web-dir www
          npx cap add android

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Vault.apk

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Vault-Instalador
          path: Vault.apk
  
